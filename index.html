<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Neon Jungle Casino</title>
  <meta name="description" content="Neon-Dschungel Gambling-Spielhalle – Blackjack, Crash, Cube-Roll, Slots, Roulette, Mines. Nur zum Spaß mit virtuellen Coins.">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎰</text></svg>">
</head>
<body>
  <!-- Dekorative Dschungel-Ranken (Ecken) -->
  <div class="vines vines-tl" aria-hidden="true"></div>
  <div class="vines vines-br" aria-hidden="true"></div>
  <div class="fireflies" aria-hidden="true"></div>

  <!-- Feste Kopfleiste -->
  <header class="topbar">
    <a class="brand" href="#/" aria-label="Startseite">
      <span class="brand-leaf">🌿</span>
      <span class="brand-name">NEON<span class="brand-accent">JUNGLE</span></span>
    </a>
    <div class="topbar-right">
      <div class="balance" id="balance" title="Dein Guthaben">
        <span class="coin-icon">🪙</span>
        <span class="balance-value" id="balance-value">0</span>
      </div>
      <nav class="topnav">
        <a href="#/leaderboard" class="topnav-link" title="Bestenliste">🏆</a>
        <a href="#/profile" class="topnav-link" title="Profil">👤</a>
      </nav>
    </div>
  </header>

  <!-- Haupt-View-Container: hier rendert der Router -->
  <main id="view" class="view"></main>

  <!-- Toast-/Flash-Container für +X / -X Animationen -->
  <div id="toast-layer" class="toast-layer" aria-live="polite"></div>

  <!-- GAME OVER Overlay -->
  <div id="gameover" class="gameover-overlay" hidden>
    <div class="gameover-card">
      <div class="gameover-vines" aria-hidden="true"></div>
      <h1 class="gameover-title">GAME OVER</h1>
      <p class="gameover-sub">Der Dschungel hat deine Coins verschluckt.</p>
      <div class="gameover-stats">
        <div><span class="go-label">Höchster Stand</span><span class="go-peak" id="go-peak">0</span></div>
      </div>
      <button class="btn btn-primary btn-lg" id="gameover-restart">🌱 Neustart (1000 Coins)</button>
    </div>
  </div>

  <!-- Module: Reihenfolge = Abhängigkeitsreihenfolge (klassische Scripts, file://-tauglich) -->
  <script src="js/storage.js"></script>
  <script src="js/leaderboard.js"></script>
  <script src="js/coins.js"></script>
  <script src="js/ui.js"></script>
  <!-- Multiplayer-Fundament -->
  <script src="js/firebase-config.js"></script>
  <script src="js/net.js"></script>
  <!-- Gambling-Spiele -->
  <script src="js/games/blackjack.js"></script>
  <script src="js/games/crash.js"></script>
  <script src="js/games/cuberoll.js"></script>
  <script src="js/games/slots.js"></script>
  <script src="js/games/roulette.js"></script>
  <script src="js/games/mines.js"></script>
  <!-- Online-Minigames-Hub (Lobby, Modus-Wahl) -->
  <script src="js/minigames.js"></script>
  <!-- MINIGAMES:START (einzelne Minispiele) -->
  <script src="js/minigames/cookieclick.js"></script>
  <!-- MINIGAMES:END -->
  <script src="js/router.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
